benchmark: eight_schools
model: eight_schools_centered
backend: cpu
dtype: float32
step_size: 0.02
max_tree_depth: 2
predictor_beta: 0.9
dimension: 10
bucket_sizes: [2, 4]
predictors: [history]

profiles:
  tiny:
    seeds: [0]
    num_chains: 4
    num_steps: 1

  full:
    seeds: [0, 1, 2]
    num_chains: 512
    num_steps: 64
    max_tree_depth: 5
    methods: [monolithic, bucketed]
    bucket_sizes: [64, 128, 256]
    predictors: [none, random, history, hvp, hybrid]

  # Scheduling-benchmark profiles added 2026-08-09. The pre-existing profiles
  # use step sizes tuned for max_tree_depth 2-5; run at depth 8 they pin every
  # chain at the cap, which erases the work heterogeneity a bucketing scheduler
  # exists to exploit and would read as a scientific negative.
  #
  # Step sizes below were chosen by CPU sweep (C=256, 20 burn-in + 8 steps,
  # max_tree_depth=8, bucket width 32) on the ORACLE WORK RATIO, which measures
  # reclaimable work directly. Depth standard deviation was deliberately not
  # used: a bucket costs its slowest member, so what matters is the tail, not
  # the spread.
  scheduling_centered:
    # accept 0.728, depth 5.36, 0% pinned, 3.0% div (accept-targeted, T48)
    seeds: [0]
    num_chains: 512
    num_steps: 16
    step_size: 0.3
    max_tree_depth: 8
    methods: [monolithic, bucketed]
    bucket_sizes: [64, 128]
    predictors: [none, history]
  scheduling_noncentered:
    # accept 0.798, depth 3.00, 0% pinned, 0.1% div (accept-targeted, T48)
    seeds: [0]
    num_chains: 512
    num_steps: 16
    step_size: 0.6
    max_tree_depth: 8
    methods: [monolithic, bucketed]
    bucket_sizes: [64, 128]
    predictors: [none, history]

  t51_preferred_centered:
    seeds: [0, 1, 2, 3, 4]
    num_chains: 512
    num_steps: 16
    step_size: 0.3
    max_tree_depth: 8
    methods: [monolithic, bucketed]
    bucket_sizes: [64, 128]
    predictors: [none, history, last_depth]

  t51_preferred_noncentered:
    model: eight_schools_noncentered
    seeds: [0, 1, 2, 3, 4]
    num_chains: 512
    num_steps: 16
    step_size: 0.6
    max_tree_depth: 8
    methods: [monolithic, bucketed]
    bucket_sizes: [64, 128]
    predictors: [none, history, last_depth]
