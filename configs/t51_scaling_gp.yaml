benchmark: chain_scaling
model: gaussian_process
backend: cpu
dtype: float32
predictor_beta: 0.9
model_config:
  num_observations: 8
  data_seed: 37
  true_amplitude: 1.0
  true_length_scale: 0.35
  true_noise_scale: 0.08
  jitter: 0.00001

profiles:
  preferred:
    seeds: [0, 1, 2, 3, 4]
    chain_counts: [128, 256, 512, 1024]
    dimension: 3
    num_steps: 16
    step_size: 0.2
    max_tree_depth: 8
    methods: [monolithic, bucketed]
    bucket_sizes: [64, 128]
    predictors: [history, last_depth]
